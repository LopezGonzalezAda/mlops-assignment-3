
name: My First Workflow

on:
  push:
    branches: [main, 01_DockerTest]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  first-pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code repository
        uses: actions/checkout@v7

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lopezgonzalezada/hello-world-nginx
          tags: |
            type=raw,value=v1
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with automatic tags
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Show generated tags
        run: |
          echo "Generated Docker image tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Run Docker container
        run: docker run -d --name hello-world-test -p 8080:80 hello-world-nginx:v1

      - name: Test website
        run: |
          sleep 3
          curl --fail http://localhost:8080
          docker logs hello-world-test
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push --all-tags ghcr.io/lopezgonzalezada/hello-world-nginx

      - name: Stop Docker container
        if: always()
        run: docker rm -f hello-world-test || true
