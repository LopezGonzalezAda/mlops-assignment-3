
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-deployment
  namespace: mlops-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
